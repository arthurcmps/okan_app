name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Show Flutter toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test duel loading and empty state
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "shows loading and an instructive empty ranking state"

      - name: Test duel ranking retry
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "shows a safe ranking error and retries without rebuilding it"

      - name: Test duel wall retry
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "shows a safe wall error and retries its cached stream"

      - name: Test duel text duplicate guard
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "blocks a duplicated text post while the first one is pending"

      - name: Test duel reaction guard
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "labels reactions and prevents a repeated reaction request"

      - name: Test duel comments retry
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "shows a safe comments error and retries inside the sheet"

      - name: Test duel responsive ranking
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "supports ranking on a small screen and 200 percent text"

      - name: Test duel responsive wall
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "supports the wall on a small screen and 200 percent text"

      - name: Test duel unavailable session
        if: always()
        run: flutter test test/features/arena/duel_room_states_test.dart --plain-name "shows an explicit state when the session is unavailable"
